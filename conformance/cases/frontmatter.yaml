- name: required-field-missing
  description: A required frontmatter field that is absent is reported.
  schema: family-tree.yaml
  documents:
    - path: nobirth.md
      content: |
        ---
        document_type: person
        person_id: nobirth
        name: No Birth
        ---

        # No Birth

        ## Life

        Missing the required `birth` field.
  expect:
    - file: nobirth.md
      path: "frontmatter.birth"
      severity: error

- name: primary-key-implicitly-required-empty-string
  description: >
    A primary_key field is implicitly required even when the schema never
    marks it `required: true`: an empty-string value is reported as
    required-field, once per document. Two documents sharing the same blank
    key are NOT a duplicate-key collision — an absent identity is not a
    shared identity.
  schema: implicit-pk.yaml
  documents:
    - path: blank1.md
      content: |
        ---
        person_id: ""
        ---
        # Blank One

        ## Relations
    - path: blank2.md
      content: |
        ---
        person_id: ""
        ---
        # Blank Two

        ## Relations
  expect:
    - file: blank1.md
      path: "frontmatter.person_id"
      severity: error
      message_contains: "person_id"
    - file: blank2.md
      path: "frontmatter.person_id"
      severity: error
      message_contains: "person_id"

- name: primary-key-implicitly-required-null
  description: >
    Same as the empty-string case, but the primary key is YAML `null`
    (equivalent to the field being present with no value).
  schema: implicit-pk.yaml
  documents:
    - path: null1.md
      content: |
        ---
        person_id: null
        ---
        # Null One

        ## Relations
    - path: null2.md
      content: |
        ---
        person_id: null
        ---
        # Null Two

        ## Relations
  expect:
    - file: null1.md
      path: "frontmatter.person_id"
      severity: error
      message_contains: "person_id"
    - file: null2.md
      path: "frontmatter.person_id"
      severity: error
      message_contains: "person_id"

- name: primary-key-implicitly-required-absent
  description: >
    The primary key field is implicitly required even when it is entirely
    absent from frontmatter (not merely blank).
  schema: implicit-pk.yaml
  documents:
    - path: missing.md
      content: |
        ---
        title: No key at all
        ---
        # Missing

        ## Relations
  expect:
    - file: missing.md
      path: "frontmatter.person_id"
      severity: error
      message_contains: "person_id"

- name: primary-key-falsy-zero-is-valid
  description: >
    A primary_key value of YAML integer 0 coerces to the string "0" and is a
    legitimate, usable key: it must NOT trigger required-field, and other
    documents reference it normally (including satisfying reciprocity).
  schema: implicit-pk.yaml
  documents:
    - path: zero.md
      content: |
        ---
        person_id: 0
        ---
        # Zero

        ## Relations

        - Ref → `1`
    - path: one.md
      content: |
        ---
        person_id: 1
        ---
        # One

        ## Relations

        - Ref → `0`
  expect: []

- name: primary-key-required-field-not-double-reported
  description: >
    When a primary_key field is ALSO explicitly `required: true` in the
    schema (the house style for most schemas in this suite), a blank value
    produces exactly one required-field finding, not two.
  schema: person-relations.yaml
  documents:
    - path: blank.md
      content: |
        ---
        person_id: ""
        ---
        # Blank

        ## Relations
  expect:
    - file: blank.md
      path: "frontmatter.person_id"
      severity: error

- name: type-pattern-rejected
  description: A field value that does not match its value_type pattern is reported.
  schema: family-tree.yaml
  documents:
    - path: badbirth.md
      content: |
        ---
        document_type: person
        person_id: badbirth
        name: Bad Birth
        birth: sometime soon
        ---

        # Bad Birth

        ## Life

        Birth is not a Shire-Reckoning year.
  expect:
    - file: badbirth.md
      path: "frontmatter.birth"
      severity: error

- name: enum-rejected
  description: A field value outside its enum is reported.
  schema: structure.yaml
  documents:
    - path: rec-1.md
      content: |
        ---
        id: rec-1
        code: "1"
        rank: extreme
        ---

        # Record 1

        ## Body

        Rank is not one of the allowed values.
  expect:
    - file: rec-1.md
      path: "frontmatter.rank"
      severity: error

- name: list-field-item-type-checked
  description: Every element of a list-valued field is validated against `items`.
  schema: note.yaml
  documents:
    - path: standup-notes.md
      content: |
        ---
        note_id: standup-notes
        title: Standup Notes
        tags:
          - Not A Slug!
        ---

        # Standup Notes

        ## Body

        A tag that is not a valid slug.
  expect:
    - file: standup-notes.md
      path: "frontmatter.tags[0]"
      severity: error

- name: list-field-any-of-no-option-matches
  description: A list item that matches no any_of option (object missing a required field) is reported.
  schema: note.yaml
  documents:
    - path: links-note.md
      content: |
        ---
        note_id: links-note
        title: Links Note
        links:
          - label: Board
        ---

        # Links Note

        ## Body

        A link object missing its required `url`.
  expect:
    - file: links-note.md
      path: "frontmatter.links[0]"
      severity: error

- name: valid-note
  description: A well-formed single-schema note with list fields produces no findings.
  schema: note.yaml
  documents:
    - path: good-note.md
      content: |
        ---
        note_id: good-note
        title: Good Note
        priority: high
        tags:
          - meeting
          - team
        links:
          - some-related-note
          - label: Board
            url: https://example.test/board
        ---

        # Good Note

        ## Body

        Everything in order.
  expect: []

- name: strict-frontmatter-rejects-unknown-field
  description: >
    With additional_fields:false, a frontmatter field not declared in the schema
    is an error; document_type is exempt as the multi-schema routing field.
  schema: strict-frontmatter.yaml
  documents:
    - path: extra.md
      content: |
        ---
        id: extra
        document_type: thing
        colour: blue
        ---

        # Extra
  expect:
    - file: extra.md
      path: "frontmatter.colour"
      severity: error
