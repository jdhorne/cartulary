[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cartulary"
version = "0.1.0"
description = "Foreign keys for your Markdown docs: cross-document referential integrity, not just schema validation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jason Horne" }]
keywords = [
    "markdown",
    "schema",
    "validation",
    "frontmatter",
    "referential-integrity",
    "cross-references",
    "linter",
    "yaml",
    "documentation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "marko>=2.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cartulary = "cartulary.validator:main"

[tool.setuptools]
packages = ["cartulary"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
